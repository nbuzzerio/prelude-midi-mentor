name: Prelude CI and Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: prelude-dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: prelude-dist
          path: dist

      - name: Deploy static files
        run: |
          mkdir -p /var/www/prelude
          rsync -a --delete dist/ /var/www/prelude/
